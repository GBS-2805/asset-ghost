<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>GitHub Asset Mine — vault store</title>
<link rel="preconnect" href="https://api.github.com">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="preconnect" href="https://opengraph.githubassets.com">
<link rel="preconnect" href="https://avatars.githubusercontent.com">
<style>
  :root{
    --bg:#161618; --panel:#1e1e21; --card:#242428; --line:#333338;
    --text:#ececef; --dim:#9a9aa2; --accent:#7cc4ff; --star:#e8c35a; --ok:#6fd08c;
    --r-ctrl:8px; --r-card:12px; --r-pill:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:#3a3a40 transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#3a3a40;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,sans-serif;display:flex;height:100vh;height:100dvh}
  button{font:inherit;color:inherit}

  aside{width:232px;min-width:196px;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;overflow-y:auto;flex-shrink:0;overscroll-behavior:contain}
  aside h1{font-size:18px;margin-bottom:2px}
  aside p.sub{color:var(--dim);font-size:12px;margin-bottom:12px}
  #favtab{margin-bottom:4px}
  #favops{display:none;gap:6px;margin-bottom:8px}
  body.fav-open #favops{display:flex}
  #favops button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:var(--r-ctrl);padding:8px 4px;font-size:12px;cursor:pointer}
  #favops button:hover{color:var(--text);border-color:var(--accent)}
  details.grp{margin-top:10px}
  details.grp summary{list-style:none;cursor:pointer;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:6px 4px;border-bottom:1px solid var(--line);margin-bottom:4px;user-select:none}
  details.grp summary::-webkit-details-marker{display:none}
  details.grp summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .18s ease-out;font-size:9px}
  details.grp[open] summary::before{transform:rotate(90deg)}
  .cat{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:var(--r-ctrl);cursor:pointer;font-size:14px}
  .cat:hover{background:#2b2b30}
  .cat.active{background:var(--accent);color:#10202c;font-weight:600}
  .cat:active,.chip:active,#totop:active{transform:scale(.97)}

  main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel)}
  header input[type=search]{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-ctrl);padding:9px 12px;color:var(--text);font-size:14px}
  header input[type=search]:focus{outline:1px solid var(--accent)}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select{background:var(--card);border:1px solid var(--line);border-radius:var(--r-ctrl);padding:9px;color:var(--text);font-size:13px}
  .liconly{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px;cursor:pointer;user-select:none}
  .liconly input{accent-color:var(--ok);width:15px;height:15px;cursor:pointer}
  .budget{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 10px;white-space:nowrap}
  .budget.b-ok{color:var(--ok)}
  .budget.b-mid{color:var(--star)}
  .budget.b-low{color:#ff9d9d}

  #subbar{padding:8px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel)}
  #subbar:empty{display:none}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 14px;font-size:12.5px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#10202c;font-weight:600}

  #shelfhead{display:flex;align-items:baseline;gap:10px;padding:12px 18px 0}
  #shelfhead h2{font-size:14px}
  #shelfmeta{color:var(--dim);font-size:12px}
  #status{padding:4px 18px 8px;color:var(--dim);font-size:12.5px;min-height:24px}
  #status.err{color:#ff9d9d}
  #grid{padding:6px 18px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;overflow-y:auto;flex:1;align-content:start;overscroll-behavior:contain}
  .store-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;transition:transform .18s ease-out,border-color .18s ease-out,box-shadow .18s ease-out}
  .thumb-wrap{display:block;margin:-14px -14px 8px;overflow:hidden;background:#111113;border-radius:var(--r-card) var(--r-card) 0 0}
  .thumb{display:block;width:100%;height:150px;object-fit:cover;object-position:center 20%;will-change:transform;transition:transform .18s ease-out}
  .thumb.ph{opacity:0}
  .thumb-bg{position:relative;background:linear-gradient(100deg,#1d1d20 40%,#28282c 50%,#1d1d20 60%);background-size:200% 100%;animation:shimmer 1.4s infinite}
  .thumb-bg .thumb{background:transparent}
  @media (hover:hover){
    .store-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
    .thumb-wrap:hover .thumb{transform:scale(1.05)}
  }
  .fav{position:absolute;top:22px;right:22px;z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(22,22,24,.85);color:var(--dim);font-size:16px;cursor:pointer;line-height:1}
  .fav:hover{color:var(--text);border-color:var(--accent)}
  .fav.on{color:var(--star);border-color:var(--star)}
  .store-card a.name{color:var(--accent);font-weight:600;font-size:14.5px;text-decoration:none;word-break:break-word;display:flex;align-items:center;gap:7px}
  .store-card a.name:hover{text-decoration:underline}
  .ava{width:18px;height:18px;border-radius:50%;flex-shrink:0;background:#2c2c31}
  .store-card .desc{color:var(--dim);font-size:12.5px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px}
  .pill{background:#2c2c31;border-radius:var(--r-pill);padding:2px 9px}
  .pill.star{color:var(--star)}
  .pill.lic{color:var(--ok)}
  .pill.none-lic{color:#ff9d9d}
  .empty{grid-column:1/-1;text-align:center;padding:70px 0;color:var(--dim);font-size:14px}
  .empty .big{font-size:34px;display:block;margin-bottom:10px}

  .skel-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;display:flex;flex-direction:column;gap:8px}
  .skel-thumb{height:150px;margin:-14px -14px 8px;border-radius:var(--r-card) var(--r-card) 0 0;background:linear-gradient(100deg,#1d1d20 40%,#28282c 50%,#1d1d20 60%);background-size:200% 100%;animation:shimmer 1.4s infinite}
  .skel-line{height:11px;border-radius:6px;background:linear-gradient(100deg,#1d1d20 40%,#28282c 50%,#1d1d20 60%);background-size:200% 100%;animation:shimmer 1.4s infinite}
  .skel-line.w60{width:60%}
  .skel-line.w80{width:80%}
  @keyframes shimmer{to{background-position:-200% 0}}

  #morewrap{padding:4px 18px 20px;display:flex;justify-content:center;align-items:center;gap:14px}
  #prevbtn,#nextbtn{background:var(--card);border:1px solid var(--line);border-radius:var(--r-ctrl);padding:10px 18px;font-size:14px;cursor:pointer}
  #prevbtn:hover,#nextbtn:hover{border-color:var(--accent);color:var(--accent)}
  #prevbtn:disabled,#nextbtn:disabled{opacity:.35;cursor:default}
  #pageinfo{color:var(--dim);font-size:12.5px;white-space:nowrap}
  #totop{position:fixed;bottom:56px;right:26px;z-index:9;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:18px;cursor:pointer;transition:transform .18s ease-out}
  @media (hover:hover){#totop:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-2px)}}
  footer{padding:8px 18px;border-top:1px solid var(--line);color:var(--dim);font-size:11px}
  #shelfbtn{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r-ctrl);padding:9px 12px;font:inherit;color:var(--text);cursor:pointer;white-space:nowrap}
  #shelfbtn:active{transform:scale(.97)}
  #navback{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60}

  @media(max-width:700px){
    html{overflow-y:auto}
    body{display:block;height:auto;min-height:100dvh}
    main{display:block}
    *{touch-action:auto}
    #grid{overflow:visible;overscroll-behavior:auto}
    .thumb{will-change:auto}
    #shelfbtn{display:inline-flex;align-items:center;gap:6px}
    aside{position:fixed;top:0;bottom:0;left:0;width:min(272px,82vw);max-height:none;z-index:70;transform:translateX(-105%);transition:transform .18s ease-out;box-shadow:8px 0 28px rgba(0,0,0,.35)}
    body.nav-open aside{transform:none}
    body.nav-open #navback{display:block}
    #totop{bottom:20px;right:16px}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div id="navback" aria-hidden="true"></div>
<aside>
  <h1>⛏️ GitHub Mines</h1>
  <p class="sub">live results → your vault shelves</p>
  <button id="favtab" class="cat" aria-label="Show favorites">⭐ Favorites <span class="n" id="favcount"></span></button>
  <div id="favops">
    <button id="favexp" aria-label="Export favorites">⬇ Export</button>
    <button id="favimp" aria-label="Import favorites">⬆ Import</button>
  </div>
  <input type="file" id="favfile" accept="application/json,.json" hidden>
  <details class="grp" id="grp-catlist" open>
    <summary>Vault shelves — design</summary>
    <nav id="catlist"></nav>
  </details>
  <details class="grp" id="grp-xtralist" open>
    <summary>Explore</summary>
    <nav id="xtralist"></nav>
  </details>
  <details class="grp" id="grp-diylist">
    <summary>DIY &amp; side-projects</summary>
    <nav id="diylist"></nav>
  </details>
</aside>
<main>
  <header>
    <button id="shelfbtn" aria-label="Open shelves menu" aria-expanded="false">☰ Shelves</button>
    <input type="search" id="q" placeholder="Search all of GitHub… (e.g. iso grid textures)">
    <div class="filters">
      <select id="lic" aria-label="License filter">
        <option value="">⚖ any license</option>
        <option value="mit">MIT — do anything</option>
        <option value="apache-2.0">Apache-2.0 — modify/distribute</option>
        <option value="bsd-3-clause">BSD-3</option>
        <option value="bsd-2-clause">BSD-2</option>
        <option value="mpl-2.0">MPL-2.0</option>
        <option value="lgpl-2.1">LGPL</option>
        <option value="gpl-3.0">GPL-3.0 — share-alike</option>
        <option value="ofl-1.1">OFL — fonts</option>
      </select>
      <label class="liconly" title="Hide repos whose license GitHub could not detect">
        <input type="checkbox" id="liconly" checked> licenses only
      </label>
      <select id="sort" aria-label="Sort results">
        <option value="stars">★ most stars</option>
        <option value="updated">🕘 recently updated</option>
        <option value="best">✨ best match</option>
      </select>
      <span class="budget" id="budget" title="GitHub search budget left this minute (10 fresh searches/min; cache makes repeats free)">⚖ —</span>
    </div>
  </header>
  <div id="subbar"></div>
  <div id="shelfhead"><h2 id="shelf"> Ming…</h2><span id="shelfmeta"></span></div>
  <div id="status">Pick a category or type a search.</div>
  <div id="grid"></div>
  <div id="morewrap" hidden><button id="prevbtn" aria-label="Previous page">← Prev</button><span id="pageinfo">Page 1</span><button id="nextbtn" aria-label="Next page">Next →</button></div>
  <footer>Results via GitHub's public API — ⚖ pill = license check (no license → don't take). ★ saves to Favorites. Never paste a token into this file.</footer>
  <button id="totop" aria-label="Back to top">↑</button>
</main>
<script>
const PER_PAGE = 24;
const MAX_PAGES = 40;
const TTL_MS = 6 * 60 * 60 * 1000;
const CACHE_CAP = 60;
const IMG_TTL_MS = 7 * 24 * 60 * 60 * 1000;
const IMG_CAP = 250;
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const GROUP_META = {
  catlist:  "Vault shelves — design",
  xtralist: "Explore",
  diylist:  "DIY & side-projects",
};

const CATEGORIES = [
  {group:"catlist", label:"🔢 Fonts / 10_fonts",   q:"topic:font stars:>300", subs:[
    ["Monospace",  "topic:font topic:monospace stars:>50"],

  ]},
  {group:"catlist", label:"🖼️ Illustrations",      q:"topic:illustration stars:>100", subs:[
    ["SVG packs",  "topic:illustration svg stars:>30"],
    ["All sizes",  "topic:illustrations stars:>10"],
  ]},
  {group:"catlist", label:"🧩 Icons",              q:"topic:icons stars:>200", subs:[

    ["Animated",   "topic:icons animated stars:>20"],
  ]},
  {group:"catlist", label:"🎨 Textures / CC0",     q:"topic:textures stars:>50", subs:[
    ["PBR materials",       "pbr textures stars:>50"],
    ["CC0 libraries",       "cc0 texture library stars:>20"],

  {group:"catlist", label:"🌿 HDRI",               q:"topic:hdri"},
  {group:"catlist", label:"✏️ Blender add-ons",    q:"topic:blender-addon stars:>10", subs:[
    ["Modeling",   "topic:blender-addon modeling stars:>10"],
    ["Animation",  "topic:blender-addon animation stars:>10"],
    ["Texturing",  "topic:blender-addon texture stars:>5"],
  ]},
  {group:"catlist", label:"🖌️ Blender assets",      q:"topic:blender asset stars:>10", subs:[
    ["Rigs & geo nodes","topic:blender geometry-nodes stars:>10"],
  ]},
  {group:"catlist", label:"📐 CAD",                q:"topic:cad stars:>100", subs:[
    ["OpenSCAD",   "topic:openscad stars:>50"],

  {group:"catlist", label:"🖨️ STL / 3D-print",     q:"topic:3d-printing stars:>200"},
  {group:"catlist", label:"🎬 Poster tools",       q:"topic:poster", subs:[
    ["Generators", "topic:poster generator stars:>20"],
    ["Templates",  "topic:poster template"],
    ["Typography", "topic:poster typography stars:>10"],
  ]},
  {group:"catlist", label:"🖌️ Logo & branding",    q:"topic:logo stars:>100", subs:[
    ["Brand kits",  "topic:branding stars:>100"],
    ["Generators",  "logo generator stars:>30"],
  ]},
  {group:"catlist", label:"🎨 Color palettes",     q:"topic:color-palette stars:>100", subs:[
    ["Tools",           "topic:color-palette tool stars:>30"],
    ["Contrast (a11y)", "color contrast stars:>100"],
  ]},
  {group:"catlist", label:"🧪 UI kits & systems",  q:"topic:ui-kit stars:>100", subs:[
    ["Design systems","topic:design-system stars:>200"],
    ["Figma plugins", "topic:figma-plugin stars:>30"],
  ]},
  {group:"catlist", label:"📸 Mockups",            q:"topic:mockup stars:>50", subs:[
    ["Device screens","mockup device stars:>10"],
    ["Product",       "mockup product stars:>10"],
  ]},
  {group:"catlist", label:"🎞️ Motion / Lottie",    q:"topic:lottie stars:>50", subs:[
    ["After Effects","topic:lottie topic:after-effects"],
    ["Web animation","topic:web-animation stars:>50"],
  ]},
  {group:"xtralist", label:"🔥 Trending this year", q:"created:>2026-01-01 stars:>50", sort:"best"},
  {group:"xtralist", label:"📦 Design lists & resources", q:"design resources stars:>500"},
  {group:"xtralist", label:"🎲 Surprise me", random:true},
  {group:"diylist", label:"🤖 Android apps",      q:"topic:android topic:app stars:>500", subs:[
    ["Flutter",   "topic:android topic:flutter stars:>200"],
    ["Kotlin",    "topic:android topic:kotlin stars:>300"],
    ["FOSS/privacy","topic:android topic:foss stars:>50"],
  ]},
  {group:"diylist", label:"📟 ESP32 / hardware",  q:"topic:esp32 stars:>100", subs:[
    ["Displays / CYD","topic:esp32 display stars:>20"],
    ["Firmware",      "topic:esp32 firmware stars:>50"],
    ["Sensors / IoT", "topic:esp32 topic:iot stars:>30"],
  ]},
  {group:"diylist", label:"⚡ Arduino",             q:"topic:arduino stars:>200", subs:[
    ["Displays / UI","topic:arduino display stars:>20"],
    ["Robotics",     "topic:arduino robotics stars:>20"],
    ["Sensors",      "topic:arduino sensor stars:>20"],
  ]},
  {group:"diylist", label:"🍓 Raspberry Pi",        q:"topic:raspberry-pi stars:>300", subs:[
    ["Retro gaming","topic:raspberry-pi retro stars:>50"],
    ["Homelab",     "topic:raspberry-pi homelab stars:>20"],
  ]},
  {group:"diylist", label:"🏠 Home automation",     q:"topic:home-assistant stars:>100", subs:[
    ["Dashboards",    "topic:home-assistant dashboard stars:>30"],
    ["ESPHome/Zigbee","topic:home-assistant esphome stars:>10"],
  ]},
  {group:"diylist", label:"🛰️ Self-hosted apps",    q:"topic:self-hosted stars:>500", subs:[
    ["Media",        "topic:self-hosted media stars:>200"],
    ["Files / cloud","topic:self-hosted cloud stars:>200"],
    ["Privacy",      "topic:self-hosted privacy stars:>100"],
  ]},
];

const grid = document.getElementById("grid"), statusEl = document.getElementById("status"),
      budgetEl = document.getElementById("budget"), subbar = document.getElementById("subbar"),
      prevBtn = document.getElementById("prevbtn"), nextBtn = document.getElementById("nextbtn"), pageinfo = document.getElementById("pageinfo"), licSel = document.getElementById("lic"),
      liconly = document.getElementById("liconly"), shelfEl = document.getElementById("shelf"),
      shelfMeta = document.getElementById("shelfmeta");
let activeBtn = null;
let lastItems = [];
let state = {q:null, sort:"stars", page:1, total:0};
let reqId = 0;
let repoIndex = new Map();

const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function lsKeys(prefix){
  const out = [];
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(prefix) === 0) out.push(k);
  }
  return out;
}
function cacheGet(key, ttl){
  try{
    const hit = JSON.parse(localStorage.getItem(key));
    if(hit && Date.now() - hit.t < ttl) return hit;
  }catch(e){}
  return null;
}
function cacheSet(prefix, key, data, cap){
  try{
    const stamps = lsKeys(prefix).map(k => {
      try{ return [k, (JSON.parse(localStorage.getItem(k)) || {}).t || 0]; }
      catch(e){ return [k, 0]; }
    });
    if(stamps.length + 1 > cap){
      stamps.sort((a,b) => a[1] - b[1]);
      for(let j = 0; j <= stamps.length - cap; j++) localStorage.removeItem(stamps[j][0]);
    }
    localStorage.setItem(key, JSON.stringify({t:Date.now(), ...data}));
  }catch(e){}
}

async function apiFetch(query, sort, page){
  const key = "ghmine:" + query + "|" + (sort||"") + "|" + page;
  const hit = cacheGet(key, TTL_MS);
  if(hit) return hit;
  const url = "https://api.github.com/search/repositories?per_page=" + PER_PAGE +
    (sort && sort !== "best" ? "&sort=" + sort : "") +
    (page > 1 ? "&page=" + page : "") + "&q=" + encodeURIComponent(query);
  const res = await fetch(url);
  const left = res.headers.get("x-ratelimit-remaining");
  if(left !== null){
    const n = parseInt(left, 10);
    budgetEl.textContent = "⚖ " + n + "/10";
    budgetEl.className = "budget " + (n >= 7 ? "b-ok" : n >= 3 ? "b-mid" : "b-low");
  }
  if(res.status === 403 || res.status === 429){
    let wait = 60;
    const resetSec = parseInt(res.headers.get("x-ratelimit-reset") || "0", 10);
    if(resetSec) wait = Math.max(1, Math.round(resetSec - Date.now()/1000));
    throw new Error("GitHub search budget used up — try again in " + wait + "s (repeat visits stay free via cache).");
  }
  if(!res.ok) throw new Error("GitHub API error " + res.status);
  const data = await res.json();
  const out = {items: data.items || [], total: data.total_count || 0};
  cacheSet("ghmine:", key, out, CACHE_CAP);
  return out;
}

const OG = r => "https://opengraph.githubassets.com/seed1/" + r.full_name;
const BAD_IMG = /shields\.io|travis|circleci|appveyor|badge|codecov|coveralls|workflows\//i;

function toAbs(u, full, branch){
  u = u.trim().replace(/^\.?\//, "");
  if(/^https?:\/\//.test(u)) return u.replace("/blob/", "/raw/");
  return "https://raw.githubusercontent.com/" + full + "/" + branch + "/" + u;
}

function readmeImage(text, full, branch){
  const re = /!\[[^\]]*\]\(\s*<?([^)>\s]+)|<img[^>]+src=["']([^"']+)["']/g;
  let m;
  while((m = re.exec(text))){
    const url = toAbs(m[1] || m[2], full, branch);
    if(!/^https?:\/\//.test(url) || BAD_IMG.test(url)) continue;
    if(/\.(png|jpe?g|webp|gif|svg|avif)(\?|$)/i.test(url)) return url;
    if(url.indexOf("raw.githubusercontent.com") !== -1) return url;
  }
  return null;
}

function applyThumb(img, url, og){
  img.onload = () => img.classList.remove("ph");
  img.onerror = () => {
    if(img.dataset.triedog) { img.style.display = "none"; return; }
    img.dataset.triedog = "1";
    img.src = og;
  };
  img.src = url;
}

async function upgradeThumb(r){
  if(!r.default_branch || !r.full_name) return;
  const img = grid.querySelector('img[data-repo="' + CSS.escape(r.full_name) + '"]');
  if(!img) return;
  const og = OG(r), full = r.full_name, branch = r.default_branch;
  const ikey = "ghimg:" + full + "|" + branch;
  const cached = cacheGet(ikey, IMG_TTL_MS);
  if(cached){ applyThumb(img, cached.url, og); return; }
  for(const name of ["README.md", "readme.md"]){
    let text = "";
    try{
      const res = await fetch("https://raw.githubusercontent.com/" + full + "/" + branch + "/" + name);
      if(res.ok) text = await res.text();
    }catch(e){}
    if(!text) continue;
    const url = readmeImage(text, full, branch);
    if(!url) continue;
    applyThumb(img, url, og);
    cacheSet("ghimg:", ikey, {url}, IMG_CAP);
    return;
  }
}

const thumbObserver = ("IntersectionObserver" in window)
  ? new IntersectionObserver(entries => {
      entries.forEach(en => {
        if(!en.isIntersecting) return;
        thumbObserver.unobserve(en.target);
        const r = repoIndex.get(en.target.dataset.repo);
        if(r) upgradeThumb(r);
      });
    }, {root: window.matchMedia("(max-width:700px)").matches ? null : grid, rootMargin: "300px 0px"})
  : null;

let FAVS = (() => { try{ return JSON.parse(localStorage.getItem("gh_favs") || "{}"); }catch(e){ return {}; } })();
let favOpen = false;
function saveFavs(){ try{ localStorage.setItem("gh_favs", JSON.stringify(FAVS)); }catch(e){} }
function updateFavCount(){
  const n = Object.keys(FAVS).length;
  document.getElementById("favcount").textContent = n ? "(" + n + ")" : "";
}
function toggleFav(fullName, btn, repoObj){
  if(FAVS[fullName]){
    delete FAVS[fullName];
    if(btn) btn.classList.remove("on");
  }else{
    FAVS[fullName] = {saved: Date.now(), repo: repoObj || null};
    if(btn) btn.classList.add("on");
  }
  saveFavs();
  updateFavCount();
  if(favOpen) renderFavs();
}
function mergeFavs(data){
  let added = 0;
  for(const [name, entry] of Object.entries(data.favorites || {})){
    if(!FAVS[name]){ FAVS[name] = entry; added++; }
  }
  if(added){ saveFavs(); updateFavCount(); if(favOpen) renderFavs(); }
  return added;
}

document.getElementById("favexp").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({saved_at: new Date().toISOString(), favorites: FAVS}, null, 2)], {type: "application/json"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "favorites.json";
  link.click();
  URL.revokeObjectURL(link.href);
  statusEl.className = "";
  statusEl.textContent = "favorites.json downloaded. Drop it into tools/ in the repo (and push) to back it up on GitHub — it auto-loads on every device.";
});

document.getElementById("favimp").addEventListener("click", () => document.getElementById("favfile").click());
document.getElementById("favfile").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  try{
    const added = mergeFavs(JSON.parse(await file.text()));
    statusEl.className = "";
    statusEl.textContent = "Imported " + added + " new favorites (" + Object.keys(FAVS).length + " total). Import only adds — it never deletes.";
  }catch(err){
    statusEl.className = "err";
    statusEl.textContent = "That file isn't a valid favorites export.";
  }
});

function renderFavs(){
  const items = Object.entries(FAVS)
    .sort((a, b) => b[1].saved - a[1].saved)
    .map(([name, entry]) => ({full_name: name, html_url: "https://github.com/" + name,
                              ...(entry.repo || {})}));
  shelfEl.textContent = "⭐ Favorites";
  shelfMeta.textContent = items.length ? items.length + " saved" : "empty";
  document.title = "Favorites — GitHub Mines";
  if(!items.length) statusEl.textContent = "No favorites yet — hit the ★ on any card.";
  render(items, false);
  morewrap.hidden = true;
  if(items.length) statusEl.textContent = "Click ★ to remove. Saved in this browser — Export for a backup file.";
}

function render(repos, append){
  lastItems = repos.slice();
  repoIndex = new Map(repos.map(r => [r.full_name, r]));
  const html = repos.map(r => `
    <div class="store-card">
      <button class="fav${FAVS[r.full_name] ? " on" : ""}" data-fav="${esc(r.full_name)}" title="Save to favorites" aria-label="Toggle favorite for ${esc(r.full_name)}">★</button>
      <a class="thumb-wrap" href="${r.html_url}" target="_blank" rel="noopener">
        <div class="thumb-bg"><img class="thumb ph" loading="lazy" referrerpolicy="no-referrer" alt="" data-og="${OG(r)}" data-repo="${esc(r.full_name)}"></div>
      </a>
      <a class="name" href="${r.html_url}" target="_blank" rel="noopener">${r.owner && r.owner.avatar_url ? `<img class="ava" loading="lazy" referrerpolicy="no-referrer" alt="" src="${esc(r.owner.avatar_url)}">` : ""}${esc(r.full_name)}</a>
      <div class="desc">${esc(r.description || "— no description —")}</div>
      <div class="meta">
        ${r.stargazers_count ? `<span class="pill star">★ ${r.stargazers_count.toLocaleString()}</span>` : ""}
        ${r.language ? `<span class="pill">${esc(r.language)}</span>` : ""}
        ${r.license && r.license.spdx_id && r.license.spdx_id !== "NOASSERTION"
          ? `<span class="pill lic">⚖ ${esc(r.license.spdx_id)}</span>`
          : `<span class="pill none-lic">⚖ no license</span>`}
      </div>
    </div>`).join("");
  if(append) grid.insertAdjacentHTML("beforeend", html); else grid.innerHTML = html;
  if(thumbObserver) grid.querySelectorAll(".thumb.ph[data-repo]").forEach(el => thumbObserver.observe(el));
  else grid.querySelectorAll(".thumb.ph[data-repo]").forEach(el => {
    const r = repoIndex.get(el.dataset.repo);
    if(r) upgradeThumb(r);
  });
}

function showSkeletons(){
  grid.innerHTML = Array(8).fill(
    '<div class="skel-card"><div class="skel-thumb"></div><div class="skel-line w60"></div><div class="skel-line"></div><div class="skel-line w80"></div></div>'
  ).join("");
}

function showEmpty(){
  grid.innerHTML = '<div class="empty"><span class="big">🗄</span>Empty shelf — nothing matched these filters.<br>Turn off "licenses only" or switch license to "any".</div>';
}

function setSubs(cat){
  subbar.innerHTML = "";
  if(!cat || !cat.subs) return;
  const choices = [["All", cat.q], ...cat.subs];
  choices.forEach(([label, q], i) => {
    const c = document.createElement("button");
    c.className = "chip" + (i === 0 ? " active" : "");
    c.textContent = label;
    c.onclick = () => {
      subbar.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
      c.classList.add("active");
      const title = (cat.label.replace(/^[^ ]+ /, "")) + (label !== "All" ? " · " + label : "");
      run(q, document.getElementById("sort").value, title);
    };
    subbar.appendChild(c);
  });
}

function effectiveQuery(){
  return state.q + (licSel.value ? " license:" + licSel.value : "");
}

async function load(){
  if(!state.q) return;
  const my = ++reqId;
  const append = state.page > 1;
  statusEl.className = "";
  statusEl.textContent = "";
  if(!append) showSkeletons();
  try{
    const {items, total} = await apiFetch(effectiveQuery(), state.sort, state.page);
    if(my !== reqId) return;
    state.total = total;
    shelfMeta.textContent = total.toLocaleString() + " in pool";
    const filtered = liconly.checked
      ? items.filter(r => r.license && r.license.spdx_id && r.license.spdx_id !== "NOASSERTION")
      : items;
    if(!append && !filtered.length && items.length) showEmpty();
    else render(filtered, append);
    const shown = Math.min(state.page * PER_PAGE, total);
    const maxPage = Math.min(Math.ceil(total / PER_PAGE), MAX_PAGES);
    const licenseNote = liconly.checked ? " (license-filtered)" : "";
    statusEl.textContent = items.length
      ? (liconly.checked ? filtered.length + " licensed of " + items.length + " on this page \u00b7 " : "Showing " + shown + " of ") +
        total.toLocaleString() + " total" + licenseNote + ". \u2696 = check the license before it enters the vault."
      : "Nothing found \u2014 try loosening filters.";
    const multi = maxPage > 1 && items.length;
    morewrap.hidden = !multi;
    if(multi){
      pageinfo.textContent = "Page " + state.page + " / " + maxPage;
      prevBtn.disabled = state.page <= 1;
      nextBtn.disabled = state.page >= maxPage;
    }
  }catch(e){
    if(my !== reqId) return;
    statusEl.className = "err";
    statusEl.textContent = e.message;
  }
}

function setShelf(title){
  shelfEl.textContent = title;
  document.title = title + " — GitHub Mines";
}

function run(q, sort, title){
  closeNav();
  favOpen = false;
  document.body.classList.remove("fav-open");
  document.getElementById("favtab").classList.remove("active");
  morewrap.hidden = true;
  state = {q, sort: sort || "stars", page: 1, total: 0};
  setShelf(title || "(" + q + ")");
  if(hashQ() !== q) location.hash = q;
  load();
}

function pickCategory(cat, btn){
  if(activeBtn) activeBtn.classList.remove("active");
  btn.classList.add("active"); activeBtn = btn;
  document.getElementById("q").value = "";
  setSubs(cat);
  const title = cat.label.replace(/^[^ ]+ /, "");
  if(cat.random){
    const pool = CATEGORIES.filter(c => !c.random && c.group === "catlist");
    const pick = pool[Math.floor(Math.random() * pool.length)];
    run(pick.q, "stars", title + " → " + pick.label.replace(/^[^ ]+ /, ""));
    return;
  }
  run(cat.q, cat.sort || document.getElementById("sort").value, title);
}

function buildButtons(){
  const lists = {};
  CATEGORIES.forEach(c => (lists[c.group] = lists[c.group] || []).push(c));
  for(const [id, cats] of Object.entries(lists)){
    const nav = document.getElementById(id);
    if(!nav) continue;
    cats.forEach(c => {
      const b = document.createElement("button");
      b.className = "cat"; b.textContent = c.label;
      b.onclick = () => pickCategory(c, b);
      nav.appendChild(b);
    });
  }
}

function hashQ(){
  try{ return decodeURIComponent(location.hash.replace(/^#/, "")); }catch(e){ return ""; }
}

document.getElementById("favtab").addEventListener("click", e => {
  closeNav();
  e.currentTarget.classList.add("active");
  if(activeBtn){ activeBtn.classList.remove("active"); activeBtn = null; }
  favOpen = true;
  document.body.classList.add("fav-open");
  subbar.innerHTML = "";
  document.getElementById("q").value = "";
  statusEl.className = "";
  grid.innerHTML = "";
  renderFavs();
});

grid.addEventListener("click", e => {
  const btn = e.target.closest(".fav");
  if(!btn) return;
  e.preventDefault();
  const name = btn.dataset.fav;
  const repo = (lastItems || []).find(x => x.full_name === name) || null;
  toggleFav(name, btn, repo);
});

window.addEventListener("hashchange", () => {
  const q = hashQ();
  if(q && q !== state.q){
    if(activeBtn) activeBtn.classList.remove("active");
    activeBtn = null;
    subbar.innerHTML = "";
    run(q, document.getElementById("sort").value);
  }
});

document.getElementById("q").addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.value.trim()){
    if(activeBtn) activeBtn.classList.remove("active");
    activeBtn = null;
    subbar.innerHTML = "";
    run(e.target.value.trim(), document.getElementById("sort").value);
  }
});
document.getElementById("sort").addEventListener("change", () => {
  if(!favOpen && state.q) run(state.q, document.getElementById("sort").value);
});
licSel.addEventListener("change", () => {
  if(!favOpen && state.q) run(state.q, document.getElementById("sort").value);
});
liconly.addEventListener("change", () => {
  if(!favOpen && state.q) load();
});
const scrollTop = () => {
  const behavior = REDUCED ? "auto" : "smooth";
  if(window.matchMedia("(max-width:700px)").matches) window.scrollTo({top: 0, behavior});
  else grid.scrollTo({top: 0, behavior});
};
function gotoPage(p){
  state.page = p;
  load();
  scrollTop();
}
prevBtn.addEventListener("click", () => gotoPage(state.page - 1));
nextBtn.addEventListener("click", () => gotoPage(state.page + 1));
const totop = document.getElementById("totop");
totop.addEventListener("click", () => {
  const m = window.matchMedia("(max-width:700px)");
  const behavior = REDUCED ? "auto" : "smooth";
  if(m.matches) window.scrollTo({top: 0, behavior});
  else grid.scrollTo({top: 0, behavior});
});

const shelfBtn = document.getElementById("shelfbtn");
const navbackEl = document.getElementById("navback");
function closeNav(){ document.body.classList.remove("nav-open"); shelfBtn.setAttribute("aria-expanded", "false"); }
shelfBtn.addEventListener("click", () => {
  const open = document.body.classList.toggle("nav-open");
  shelfBtn.setAttribute("aria-expanded", String(open));
});
navbackEl.addEventListener("click", closeNav);

Object.keys(GROUP_META).forEach(id => {
  const det = document.getElementById("grp-" + id);
  if(!det) return;
  const saved = localStorage.getItem("gh_grp_" + id);
  if(saved !== null) det.open = saved === "1";
  det.addEventListener("toggle", () => {
    try{ localStorage.setItem("gh_grp_" + id, det.open ? "1" : "0"); }catch(e){}
  });
});

buildButtons();
updateFavCount();
(async () => {
  try{
    const res = await fetch("favorites.json");
    if(res.ok){
      const added = mergeFavs(await res.json());
      if(added){
        statusEl.className = "";
        statusEl.textContent = "Loaded " + added + " favorite(s) from your vault backup (tools/favorites.json).";
      }
    }
  }catch(e){}
})();
const start = hashQ();
if(start){
  state = {q: start, sort: document.getElementById("sort").value, page: 1, total: 0};
  setShelf("(" + start + ")");
  load();
}else{
  document.querySelector("#catlist .cat").click();
}
</script>
</body>
</html>
